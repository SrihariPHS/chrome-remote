# Production-shaped example: loopback port, TLS in front, persistent data.
# For a plain local run use the docker-compose.yml in the repository root.
name: chrome-remote

services:
  chrome:
    build:
      context: ..
      dockerfile: Dockerfile
    image: chrome-remote:latest
    container_name: chrome
    restart: unless-stopped
    env_file:
      - ./secrets.env
    environment:
      IW_PORT: "8787"
      IW_DATA: /data
      IW_MAX_SESSIONS: "4"
      IW_POOL: "2"
      IW_SESSION_TTL_MIN: "20"
      IW_HEADFUL: "1"
    ports:
      # Loopback only: your proxy (Caddy, nginx, cloudflared) reaches it here.
      - "127.0.0.1:8788:8787"
    volumes:
      - ./data:/data
    shm_size: "1gb"
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
