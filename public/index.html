<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>chrome</title>
  <meta name="description" content="A remote Chrome you can watch and use." />
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css?v=20261103" />
</head>
<body>
  <div class="window" id="window">
    <div class="titlebar" id="titlebar">
      <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="session" id="sessionName">chrome</div>
      <button class="icon ghost" id="menuBtn" title="Menu" aria-label="Menu"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="8" cy="3" r="1.4" fill="currentColor"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="8" cy="13" r="1.4" fill="currentColor"/></svg></button>
    </div>

    <div class="tabstrip">
      <div class="tabs" id="tabs"></div>
      <button class="newtab" id="newTab" title="New tab" aria-label="New tab">+</button>
    </div>

    <div class="toolbar">
      <button class="icon" id="back" title="Back" aria-label="Back">‹</button>
      <button class="icon" id="fwd" title="Forward" aria-label="Forward">›</button>
      <button class="icon" id="reload" title="Reload" aria-label="Reload">⟳</button>
      <form class="omnibox" id="omnibox" autocomplete="off">
        <span class="lock" id="lock" title="Secure">
          <svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path d="M8 1a3 3 0 0 0-3 3v2H4.5A1.5 1.5 0 0 0 3 7.5v6A1.5 1.5 0 0 0 4.5 15h7a1.5 1.5 0 0 0 1.5-1.5v-6A1.5 1.5 0 0 0 11.5 6H11V4a3 3 0 0 0-3-3Zm1.7 5H6.3V4a1.7 1.7 0 0 1 3.4 0v2Z" fill="currentColor"/></svg>
        </span>
        <input id="url" name="url" spellcheck="false" autocomplete="off" placeholder="Search or enter address" />
      </form>
    </div>

    <div class="viewport" id="viewport">
      <canvas id="screen" width="1280" height="800"></canvas>
      <div class="veil" id="veil"><span id="veilText">connecting…</span></div>
    </div>
  </div>

  <div class="popover" id="menu" hidden>
    <button data-act="newtab">New tab</button>
    <button data-act="copy">Copy address</button>
    <button data-act="reload">Reload</button>
    <hr />
    <button data-act="dev">Diagnostics</button>
  </div>

  <script src="/app.js?v=20261103" type="module"></script>
</body>
</html>
