<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>chrome</title>
  <meta name="description" content="A remote Chrome you can watch and drive from any device." />
  <meta name="theme-color" content="#f6f6f7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="chrome" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css?v=20261104" />
</head>
<body>
  <div class="win">
    <div class="titlebar">
      <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="brand" id="brand">chrome</div>
      <button class="icon ghost" id="menuBtn" title="Menu" aria-label="Menu" aria-haspopup="true">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="8" cy="3" r="1.4" fill="currentColor"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="8" cy="13" r="1.4" fill="currentColor"/></svg>
      </button>
    </div>

    <div class="tabstrip">
      <div class="tabs" id="tabs" role="tablist"></div>
      <button class="newtab" id="newTab" title="New tab" aria-label="New tab">+</button>
    </div>

    <div class="toolbar">
      <button class="icon nav" id="back" title="Back" aria-label="Back">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M10.5 3 5.5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon nav" id="fwd" title="Forward" aria-label="Forward">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M5.5 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon nav" id="reload" title="Reload" aria-label="Reload">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.6V6h-3.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <form class="omnibox" id="omnibox" autocomplete="off">
        <span class="lock" id="lock" title="Connection">
          <svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><path d="M8 1a3 3 0 0 0-3 3v2H4.5A1.5 1.5 0 0 0 3 7.5v6A1.5 1.5 0 0 0 4.5 15h7a1.5 1.5 0 0 0 1.5-1.5v-6A1.5 1.5 0 0 0 11.5 6H11V4a3 3 0 0 0-3-3Zm1.7 5H6.3V4a1.7 1.7 0 0 1 3.4 0v2Z" fill="currentColor"/></svg>
        </span>
        <input id="url" name="url" spellcheck="false" autocomplete="off" autocapitalize="off"
               enterkeyhint="go" placeholder="Search or enter address" aria-label="Address" />
      </form>

      <button class="icon nav" id="keyboardBtn" title="Keyboard" aria-label="Keyboard" hidden>
        <svg viewBox="0 0 20 16" width="17" height="14" aria-hidden="true"><rect x="1" y="2" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M4 6h1.5M7 6h1.5M10 6h1.5M13 6h1.5M4 9h1.5M7 9h1.5M10 9h1.5M13 9h1.5M5 12h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
      <button class="icon nav" id="fullscreenBtn" title="Full screen" aria-label="Full screen">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <main class="viewport" id="viewport">
      <canvas id="screen" width="1280" height="800" aria-label="Remote browser screen"></canvas>
      <div class="progress" id="progress" hidden></div>
      <div class="veil" id="veil"><span id="veilText">connecting…</span></div>
      <div class="toast" id="toast" hidden></div>
    </main>
  </div>

  <textarea id="kb" class="kb" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-hidden="true" tabindex="-1"></textarea>

  <div class="menu" id="menu" role="menu" hidden>
    <button data-act="newtab" role="menuitem">New tab</button>
    <button data-act="reload" role="menuitem">Reload</button>
    <button data-act="copy" role="menuitem">Copy address</button>
    <button data-act="fullscreen" role="menuitem">Full screen</button>
    <hr />
    <button data-act="console" role="menuitem">Diagnostics</button>
    <button data-act="signout" role="menuitem">Sign out</button>
  </div>

  <div class="gate" id="gate" hidden>
    <form id="gateForm">
      <h1>Sign in</h1>
      <p>Paste the access token, or type the PIN.</p>
      <input id="gateInput" inputmode="text" autocomplete="off" spellcheck="false" placeholder="Token or PIN" />
      <button id="gateBtn">Open</button>
      <p class="gate-msg" id="gateMsg"></p>
    </form>
  </div>

  <script src="/app.js?v=20261104" type="module"></script>
</body>
</html>
