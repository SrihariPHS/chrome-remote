<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>New Tab</title>
<style>
  :root {
    --ink: #202124;
    --muted: #5f6368;
    --line: #dcdce0;
    --accent: #1a73e8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(1200px 600px at 50% -10%, #eef3fe 0%, transparent 60%),
      #ffffff;
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 620px; text-align: center; }
  .mark {
    width: 54px; height: 54px; margin: 0 auto 18px;
    border-radius: 14px;
    background: #08080a;
    display: grid; place-items: center;
    box-shadow: 0 10px 24px rgb(8 8 10 / 18%);
  }
  .mark i {
    width: 26px; height: 26px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #eef1f5, #3a3d45 62%, #6a6f79);
    display: grid; place-items: center;
  }
  .mark i::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #d6ff4f; }
  h1 { margin: 0 0 6px; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  p.sub { margin: 0 0 26px; color: var(--muted); font-size: 13px; }

  form.search { display: flex; align-items: center; }
  .field {
    display: flex; align-items: center; gap: 10px;
    width: 100%; height: 52px;
    padding: 0 8px 0 18px;
    border: 1px solid var(--line);
    border-radius: 26px;
    background: #fff;
    box-shadow: 0 2px 10px rgb(0 0 0 / 5%);
  }
  .field:focus-within {
    border-color: rgb(26 115 232 / 45%);
    box-shadow: 0 3px 16px rgb(26 115 232 / 14%);
  }
  .field svg { flex: none; color: var(--muted); }
  .field input {
    flex: 1; min-width: 0;
    border: 0; outline: 0; background: transparent;
    font: inherit; color: var(--ink);
  }
  .field button {
    flex: none;
    height: 38px; padding: 0 18px;
    border: 0; border-radius: 19px;
    background: var(--accent); color: #fff;
    font: inherit; font-weight: 500;
  }

  nav.links {
    display: flex; flex-wrap: wrap; gap: 10px;
    justify-content: center;
    margin-top: 26px;
  }
  nav.links a {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
    font-size: 13px;
    text-decoration: none;
  }
  nav.links a:hover { border-color: #c3c6cc; background: #fafafa; }
  nav.links span.dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #c4c7cc;
  }
  footer {
    margin-top: 34px;
    color: #9aa0a6;
    font-size: 11.5px;
    letter-spacing: .01em;
  }
  @media (max-width: 520px) {
    body { padding: 16px; align-items: start; padding-top: 12vh; }
    .field { height: 48px; }
    .field button { padding: 0 14px; }
  }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"><i></i></div>
  <h1>New tab</h1>
  <p class="sub">This is a remote Chrome. Type here or in the bar above.</p>

  <form class="search" action="https://www.bing.com/search" method="get">
    <label class="field">
      <svg width="17" height="17" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.8 10.8 15 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input name="q" placeholder="Search the web" autocomplete="off" autofocus />
      <button type="submit">Search</button>
    </label>
  </form>

  <nav class="links">
    <a href="https://github.com"><span class="dot"></span>GitHub</a>
    <a href="https://en.wikipedia.org"><span class="dot"></span>Wikipedia</a>
    <a href="https://news.ycombinator.com"><span class="dot"></span>Hacker News</a>
    <a href="https://www.youtube.com"><span class="dot"></span>YouTube</a>
  </nav>

  <footer>chrome.inkwork.studio</footer>
</main>
</body>
</html>
