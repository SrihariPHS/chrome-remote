<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Kahoot Self-Test — 10 questions</title>
<style>
  :root { --p:#46178f; --p2:#2d0d63; --lime:#d6ff4f; --red:#e21b3c; --blue:#1368ce; --yellow:#d89e00; --green:#26890c; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { font-family: "Montserrat", -apple-system, system-ui, sans-serif; background: radial-gradient(1100px 700px at 50% -20%, #6a2fb4, transparent 60%), var(--p); color:#fff; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:18px; padding:18px 26px; font-weight:800; }
  header .pill { background:rgba(0,0,0,.22); border-radius:999px; padding:8px 14px; font-size:14px; }
  header .spacer { flex:1; }
  main { flex:1; display:grid; grid-template-columns:1fr 280px; gap:24px; padding:8px 34px 26px; min-height:0; }
  .card { background:#fff; color:#222; border-radius:14px; padding:28px 30px; display:flex; flex-direction:column; min-height:0; }
  #question { font-size:clamp(24px,3.1vw,38px); font-weight:800; margin:12px 0 22px; line-height:1.15; }
  #answers { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:12px; align-content:start; }
  .answer { border:0; border-radius:9px; padding:20px; color:#fff; text-align:left; font:800 26px/1.2 inherit; cursor:pointer; box-shadow:inset 0 -5px rgba(0,0,0,.22); }
  .answer:nth-child(1){ background:var(--red); } .answer:nth-child(2){ background:var(--blue); }
  .answer:nth-child(3){ background:var(--yellow); } .answer:nth-child(4){ background:var(--green); }
  .answer:active { transform:translateY(2px); }
  aside { display:flex; flex-direction:column; gap:14px; justify-content:center; align-items:center; }
  #progress { font-size:14px; letter-spacing:.12em; text-transform:uppercase; opacity:.6; }
  #score { font:900 42px/1 inherit; }
  #startScreen, #final { position:fixed; inset:0; display:grid; place-items:center; background:rgba(24,8,50,.92); z-index:5; text-align:center; padding:30px; }
  #startScreen h1, #final h1 { font-size:30px; margin:0 0 10px; letter-spacing:-.03em; }
  #start, #again { border:0; border-radius:10px; padding:14px 24px; background:var(--lime); color:#1b1030; font:800 16px inherit; cursor:pointer; }
  #final { display:none; }
  .hidden { display:none !important; }
  .dim { opacity:.6; font-size:12px; }
</style>
</head>
<body>
<header>
  <div class="pill">Kahoot! <span class="dim">SELF-TEST</span></div>
  <div class="pill" id="progressTop">Question 1 / 10</div>
  <div class="spacer"></div>
  <div class="pill">Score <b id="scoreTop">0</b></div>
</header>
<main>
  <section class="card">
    <div id="progress">Question 1 / 10</div>
    <div id="question"></div>
    <div id="answers"></div>
  </section>
  <aside>
    <div class="dim">CORRECT</div>
    <div id="score">0</div>
    <div class="dim">/ 10</div>
  </aside>
</main>

<div id="startScreen">
  <div>
    <h1>Kahoot Self-Test</h1>
    <p class="dim">10 arithmetic questions. The bot answers in-page.</p>
    <button id="start">Start</button>
  </div>
</div>
<div id="final">
  <div>
    <h1 id="finalTitle">Done</h1>
    <p class="dim" id="finalTime"></p>
    <button id="again" onclick="location.reload()">Again</button>
  </div>
</div>

<script>
  const QS = [
    { a: 7, b: 5 }, { a: 9, b: 6 }, { a: 14, b: 8 }, { a: 11, b: 7 }, { a: 13, b: 9 },
    { a: 6, b: 8 }, { a: 15, b: 4 }, { a: 12, b: 12 }, { a: 8, b: 9 }, { a: 10, b: 7 },
  ];
  const state = { idx: 0, correct: 0, start: 0, done: false, total_ms: null, answers: 0 };
  const $ = (s) => document.querySelector(s);

  function render() {
    const q = QS[state.idx];
    const sum = q.a + q.b;
    $('#progress').textContent = `Question ${state.idx + 1} / ${QS.length}`;
    $('#progressTop').textContent = `Question ${state.idx + 1} / ${QS.length}`;
    $('#question').textContent = `What is ${q.a} + ${q.b}?`;
    const values = [sum, sum + 1, sum + 2, sum + 3];
    for (let i = values.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [values[i], values[j]] = [values[j], values[i]];
    }
    const box = $('#answers');
    box.innerHTML = '';
    for (const v of values) {
      const b = document.createElement('button');
      b.className = 'answer';
      b.textContent = String(v);
      b.addEventListener('click', () => answer(Number(b.textContent), b));
      box.appendChild(b);
    }
  }

  function answer(v, btn) {
    if (state.done) return;
    state.answers++;
    if (v === QS[state.idx].a + QS[state.idx].b) {
      state.correct++;
      $('#score').textContent = state.correct;
      $('#scoreTop').textContent = state.correct;
    }
    state.idx++;
    if (state.idx >= QS.length) {
      state.done = true;
      state.total_ms = performance.now() - state.start;
      $('#final').style.display = 'grid';
      $('#finalTitle').textContent = `${state.correct} / ${QS.length} correct`;
      $('#finalTime').textContent = `${state.total_ms.toFixed(1)} ms total`;
      window.__selftest.done = true;
      window.__selftest.total_ms = state.total_ms;
      window.__selftest.correct = state.correct;
      window.__selftest.answers = state.answers;
      return;
    }
    render();
  }

  $('#start').addEventListener('click', () => {
    if (state.start) return;
    state.start = performance.now();
    $('#startScreen').classList.add('hidden');
    render();
  });

  window.__selftest = {
    done: false,
    total_ms: null,
    correct: 0,
    answers: 0,
    get started() { return state.start > 0; },
  };
</script>
</body>
</html>
